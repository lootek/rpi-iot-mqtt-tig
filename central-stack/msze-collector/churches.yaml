# Church list. Adding a church = add an entry here.
# ETA ranges are placeholders until supplied; eta_confirmed stays false until then
# (reported by /health).
churches:
  - id: morawica
    name: Morawica
    mode: car
    eta_min: 10  # TODO(Piotr): ETA range
    eta_max: 15
    eta_confirmed: false
    location: Morawica
    schedule_urls: ["http://www.parafia.morawica.net/"]
    ogloszenia_urls: ["http://www.parafia.morawica.net/"]

  - id: brzoskwinia
    name: Brzoskwinia
    mode: walk
    eta_min: 10
    eta_max: 15
