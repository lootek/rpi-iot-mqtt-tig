version: '3'

services:
  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    network_mode: host
    env_file:
     - ../env/grafana
     # Gmail App Password, gitignored. GF_SMTP_PASSWORD overrides grafana.ini's
     # <pass> placeholder. Without it, a container recreate loses SMTP auth and
     # every alert goes silent with no error. See env/grafana.secret.example.
     - ../env/grafana.secret
    restart: unless-stopped
    ports:
     - "3000:3000"
    volumes:
      - ../volumes/grafana/db:/var/lib/grafana
      - ../volumes/grafana/log:/var/log/grafana
      - ../volumes/grafana/conf:/etc/grafana
