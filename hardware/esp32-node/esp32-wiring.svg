<text x="30" y="278" font-size="12" font-weight="bold">CO2 LEDs</text>
<text x="30" y="293" font-size="11" fill="#555">long leg (+) toward the resistor</text>
<text x="100" y="598" font-size="11" fill="#555">cathodes (-) to GND</text>
<text x="30" y="715" font-size="12" fill="#333">&#8226; I2C bus: BME280 (0x76) and SCD30 (0x61) share SDA D21 / SCL D22.</text>
<text x="30" y="735" font-size="12" fill="#333">&#8226; DHT22 data on D4. The 3-pin module has a built-in pull-up; a bare 4-pin DHT22 needs 10k from DATA to 3V3.</text>
<text x="30" y="755" font-size="12" fill="#333">&#8226; LED pins D25 / D26 / D27 go high to light the LED (series 220 ohm, about 6 mA at 3.3 V).</text>
<text x="30" y="775" font-size="12" fill="#333">&#8226; On the PCB: LEDs go in the 4-way terminal as G Y R K (v1) or are soldered on the board (v1b).</text>
