<text x="30" y="34" font-size="22" font-weight="bold">ESP32 node - wiring (room node: BME280 + SCD30 + DHT22 + 3 LEDs)</text>
<text x="30" y="56" font-size="12.5" fill="#444">30-pin DevKit V1, USB end at the bottom. All parts run from 3V3. LEDs: on-board (v1b) or on the 4-way terminal (v1) - same circuit.</text>
<text x="30" y="74" font-size="12.5" fill="#444">Backyard shed: BME280 only. Wires that cross without a dot are not connected.</text>
