  telegraf:
    image: telegraf:1.33
    container_name: telegraf
    hostname: ${HOSTNAME:-unknown_hostname}
    restart: unless-stopped
    env_file:
      - ../env/telegraf
    # networks:
    #   - influxdb
    privileged: true
    # GID of the host's `docker` group, so telegraf (non-root) can read
    # /var/run/docker.sock for inputs.docker. Differs per host — set in
    # host-monitoring/.env (not committed). Check with `getent group docker`.
    user: telegraf:${DOCKER_GID:-995}
    volumes:
      - ../volumes/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # cadvisor: dropped in favor of telegraf's own [[inputs.docker]] — much lighter
  # on RAM/CPU, and avoids cadvisor's cgroup memory-controller issues on the Pis
  # that boot with cgroup_disable=memory. Historical data lives in the influxdb
